<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1200">
  <title>SENERGY — обложка для ссылок</title>
  <link rel="stylesheet" href="../css/fonts.css">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    body { color: #0f2144; background: #f2f6fc; font-family: 'Manrope', sans-serif; }
    .card { position: relative; width: 1200px; height: 630px; background: linear-gradient(125deg,#f6f9ff 15%,#f0ecfa 68%,#d8e9f8); }
    .copy { position: absolute; inset: 0 auto 0 0; width: 732px; padding: 53px 0 46px 64px; }
    .brand { display: flex; align-items: center; gap: 16px; font-weight: 800; letter-spacing: .22em; font-size: 31px; }
    .brand svg { width: 36px; height: 36px; color: #3576cf; }
    .eyebrow { margin: 49px 0 17px; color: #53678c; font-size: 15px; letter-spacing: .14em; font-weight: 600; text-transform: uppercase; }
    h1 { margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500; font-size: 82px; line-height: .98; letter-spacing: -.025em; }
    .description { margin: 26px 0 0; color: #33456b; font-size: 21px; line-height: 1.6; }
    .footer { position: absolute; left: 64px; bottom: 44px; display: flex; align-items: center; gap: 22px; font-size: 18px; color: #53678c; }
    .duration { padding: 10px 20px; border-radius: 99px; border: 1px solid #b2c5e3; background: #ffffff70; font-weight: 700; color: #1c4a86; }
    .portrait { position: absolute; right: 30px; top: 30px; width: 422px; height: 570px; border-radius: 180px 180px 32px 32px; overflow: hidden; box-shadow: 0 18px 44px -28px #52669480; }
    .portrait img { width: 100%; height: 100%; object-fit: cover; object-position: center 23%; }
  </style>
</head>
<body>
  <main class="card">
    <div class="portrait"><img src="../assets/img/sunita-800.webp" alt="Сунита Таубаева"></div>
    <div class="copy">
      <div class="brand"><svg viewBox="0 0 36 36" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="18" cy="18" r="7"/><path d="M18 2v5M18 29v5M2 18h5M29 18h5M6.7 6.7l3.6 3.6m15.4 15.4 3.6 3.6M6.7 29.3l3.6-3.6m15.4-15.4 3.6-3.6"/></svg>SENERGY</div>
      <p class="eyebrow">Информационно-трансформационный марафон</p>
      <h1>Марафон<br>Суниты Таубаевой</h1>
      <p class="description">Мягкий вход в закаливание.<br>Телесные и дыхательные практики.</p>
      <div class="footer"><span class="duration">14 дней</span><span>senergies.kz</span></div>
    </div>
  </main>
</body>
</html>
